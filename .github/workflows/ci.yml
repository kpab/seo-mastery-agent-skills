name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills, JSON-LD templates, and EN/JP sync
        run: python3 scripts/validate.py

      # freshness-reminder.yml runs this once a month against validate.py's
      # parser. Exercising it here means a rename on that import surfaces in
      # the PR that makes it, not in a broken reminder issue weeks later.
      - name: Build the freshness table
        run: python3 scripts/freshness_table.py > /dev/null
