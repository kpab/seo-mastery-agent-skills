name: Release

# Pushing a v* tag publishes a GitHub Release whose notes are the matching
# CHANGELOG section, so the tag, the manifest version and the changelog can
# never drift apart without the release failing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --expect-version folds the tag check into the validation run so both
      # read the frontmatter through the same parser. A sed re-implementation
      # here disagreed with validate.py over quoting: `version: "1.4.0"` passed
      # CI and then failed the release, once the tag was already immutable.
      - name: Validate skills and check the tag against every declared version
        run: python3 scripts/validate.py --expect-version "${GITHUB_REF_NAME#v}"

      - name: Extract release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" <<'PY' > release-notes.md
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # Terminate on the next version heading, on the link-definition block,
          # or on end-of-file — so the last section does not depend on either.
          pattern = (
              rf"^## \[{re.escape(version)}\][^\n]*\n"
              r"(.*?)(?=^## \[|^\[[^\]]+\]:\s*http|\Z)"
          )
          match = re.search(pattern, text, flags=re.M | re.S)
          if not match:
              sys.exit(f"No CHANGELOG section found for version {version}")
          print(match.group(1).strip())
          PY
          # -s is not enough: the section is always at least a newline.
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG section for v$version is empty"
            exit 1
          fi
          cat release-notes.md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: re-running after a failed step updates the notes rather
          # than erroring out with "release already exists".
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              --verify-tag
          fi
